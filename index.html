<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2b36" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Topo - Volumes de stocks</title>
  </head>
  <body>
    <header class="entete">
      <button type="button" class="entete-texte" id="entete-projet" title="Onglet Projet">
        <span class="entete-titre" id="titre-projet">Projet</span>
        <span class="entete-etat" id="etat"></span>
      </button>
      <div class="entete-pastilles">
        <button type="button" class="pastille-entete" id="pastille-verrou" hidden></button>
      </div>
      <!-- Mode de l'appli : 3 barres comme un signal : Base = 1 verte, Intermédiaire = 2 jaunes, Expert = 3 rouges ; ouvre les réglages -->
      <button type="button" class="entete-icone-bouton bouton-mode" id="bouton-mode" title="Mode de l'appli" aria-label="Mode de l'appli">
      </button>
      <button type="button" class="entete-icone-bouton bouton-aide" id="bouton-aide" title="Aide : afficher les bulles « ? »" aria-label="Aide" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" /><path d="M12 17h.01" /></svg>
      </button>
      <button type="button" class="entete-icone-bouton bouton-reglages" id="bouton-reglages" title="Réglages, Drive et fermer l'appli" aria-label="Réglages et fermer l'appli">
        <!-- Roue (réglages) et bouton marche / arrêt (fermer l'appli) -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-1.2 -1.2) scale(0.72)"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></g><path class="marche-arret" d="M18 13.5v3.5M15.2 15.2a4 4 0 1 0 5.6 0" /></svg>
      </button>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
