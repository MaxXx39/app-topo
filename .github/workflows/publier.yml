# Publication automatique sur GitHub Pages.
# À chaque envoi sur la branche "main" : on lance les tests,
# on construit l'application, puis on la met en ligne.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    # Même code pour l'appli (projet app-topo) et la version de test V2 (projet app_topo_v2) :
    # adresse, base de données et titre différents, pour ne jamais mélanger les deux.
    env:
      CHEMIN_APPLI: /${{ github.event.repository.name }}/
      VITE_NOM_BASE: ${{ github.event.repository.name == 'app-topo' && 'topo' || 'topo-v2' }}
      VITE_TITRE_APPLI: ${{ github.event.repository.name == 'app-topo' && 'Topo' || 'Topo V2 (test)' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publier:
    needs: construire
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
